services:
  postgres:
    image: postgres:16
    container_name: mivu-postgres-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=booklab
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mivu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  booklab-server:
    image: ghcr.io/kingauthor1212/booklabServer:latest
    container_name: booklabServer
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_NAME=booklab
    ports:
      - "5500:5500"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  web_ui:
    image: ghcr.io/kingauthor1212/booklabUi:latest
    container_name: booklabUi
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_PATH=https://Booklab.io
    depends_on:
      - booklab-server
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
